# Categories for GitHub's generated release notes. PRs are labeled by
# .github/workflows/label-pull-requests.yml; correct the label before merging.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - maintenance
    - title: Other Changes
      labels:
        - "*"

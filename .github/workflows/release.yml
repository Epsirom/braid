name: Publish
# Publishes npm packages from a version tag, then the GitHub release. Started by
# Publish Release (publish-release.yml), or by a maintainer pushing a v* tag.
# npm trusted publishing is bound to this file name: keep it release.yml.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$RELEASE_TAG is not on main" >&2; exit 1; }
          node scripts/check-release.mjs
      - run: npm ci
      - run: npm run verify
      - name: Publish core and integration packages with npm trusted publishing
        run: node scripts/publish.mjs
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi
          # Upgrade notes go above GitHub's PR list, grouped by .github/release.yml.
          node scripts/upgrade-notes.mjs "$TAG" > "$RUNNER_TEMP/upgrade-notes.md"
          gh release create "$TAG" --verify-tag --latest --generate-notes \
            --title "Braid $TAG" --notes-file "$RUNNER_TEMP/upgrade-notes.md"
